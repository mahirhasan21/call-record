name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          mkdir -p /tmp/proj
          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
          if [ -n "$ZIP" ]; then
            unzip -q -o "$ZIP" -d /tmp/proj
          else
            cp -r . /tmp/proj
          fi
          DIR=$(dirname "$(find /tmp/proj -name settings.gradle.kts | head -n 1)")
          echo "PROJ_DIR=$DIR" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: |
          cd "$PROJ_DIR"
          gradle assembleDebug --no-daemon
          mkdir -p /tmp/out
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/out/

      - uses: actions/upload-artifact@v4
        with:
          name: CallRecorder-apk
          path: /tmp/out/app-debug.apk
